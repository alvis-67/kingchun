  <style>
    :root{--navy:#092742;--orange:#ef8b27;--cream:#f7f4ed;--ink:#142534;--muted:#61717e;--line:#dbe1e3}
    *{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--ink);font-family:"Noto Sans HK",Arial,sans-serif}
    a{text-decoration:none;color:inherit}.container{width:min(1160px,calc(100% - 44px));margin:auto}
    .topbar{background:#061b2e;color:#dce9f0;font-size:13px}.topbar .container{min-height:40px;display:flex;justify-content:space-between;align-items:center;gap:20px}.quick-info{display:flex;gap:24px}.quick-info span{color:var(--orange);margin-right:5px}
    header{height:82px;background:#fff;position:sticky;top:0;z-index:10;box-shadow:0 3px 18px #09274212}.nav{height:100%;display:flex;align-items:center;justify-content:space-between}.logo{display:flex;align-items:center;gap:12px}.mark{height:47px;width:47px;background:var(--navy);color:#fff;display:grid;place-items:center;font:700 23px Oswald;clip-path:polygon(0 0,100% 0,100% 75%,50% 100%,0 75%)}.logo b{font-size:18px;letter-spacing:.08em;display:block}.logo small{font-size:10px;color:#77838c;letter-spacing:.09em}.links{display:flex;gap:27px;align-items:center;font-size:14px;font-weight:600}.links a:hover{color:var(--orange)}.call-btn{padding:12px 19px;color:#fff;background:var(--orange);font-weight:700}
    .nav-cases{position:relative}.nav-cases-trigger{display:inline-flex;align-items:center;gap:6px}.nav-cases-trigger:after{content:"▾";font-size:11px;color:var(--orange)}.nav-cases-menu{position:absolute;top:calc(100% + 14px);left:50%;transform:translateX(-50%);min-width:160px;background:#fff;box-shadow:0 12px 30px #09274222;border:1px solid var(--line);padding:8px 0;display:none;z-index:20}.nav-cases-menu a{display:block;padding:10px 18px;font-size:13px;white-space:nowrap}.nav-cases-menu a:hover{background:#f7f4ed;color:var(--orange)}.nav-cases:hover .nav-cases-menu,.nav-cases:focus-within .nav-cases-menu{display:block}
    .page-hero{background:linear-gradient(90deg,#061b2ef0,#092742aa),url("https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=1800&q=80") center/cover;color:#fff;padding:72px 0 64px}.section-tag{font:700 12px Oswald;letter-spacing:.18em;color:#f4a653}.page-hero h1{font-size:clamp(32px,4vw,48px);letter-spacing:.06em;margin:10px 0 12px}.page-hero p{max-width:560px;color:#dce7ed;line-height:1.8}
    .cats{padding:70px 0 90px}.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}.cat-card{background:#fff;min-height:280px;display:flex;flex-direction:column;overflow:hidden;transition:.25s}.cat-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px #09274218}.cat-cover{height:160px;background:#0d2d46 center/cover no-repeat;position:relative}.cat-cover span{position:absolute;left:14px;bottom:14px;background:var(--orange);color:#fff;font-size:12px;padding:5px 10px;font-weight:700}.cat-body{padding:22px 22px 26px;flex:1}.cat-body h2{margin:0 0 10px;font-size:22px;letter-spacing:.05em}.cat-body p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}.empty{padding:40px;background:#fff;color:var(--muted);text-align:center}
    footer{background:#061b2e;color:#d8e1e5;padding:40px 0 22px;margin-top:20px}.copyright{border-top:1px solid #ffffff18;padding-top:18px;color:#8598a3;font-size:12px}
    @media(max-width:850px){.links{display:none}.cat-grid{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.cat-grid{grid-template-columns:1fr}.quick-info{display:none}}
  </style>
</head>
<body>
  <div class="topbar"><div class="container"><div class="quick-info"><a href="mailto:info@kingchun.hk"><span>✉</span>info@kingchun.hk</a><a href="tel:96981486"><span>☎</span>9698 1486</a></div><div>📍 香港尖沙咀新文華中心B座1011-1015</div></div></div>
  <header><div class="container nav"><a class="logo" href="../index.html"><div class="mark">KC</div><div><b>景晉工程</b><small>KING CHUN ENGINEERING (H.K.) LIMITED</small></div></a><nav class="links"><a href="../index.html#about">關於我們</a><a href="../index.html#services">核心服務</a><a href="../index.html#promise">我們的承諾</a><div class="nav-cases"><a class="nav-cases-trigger" href="./">工程案例</a><div class="nav-cases-menu" id="navMenu"><a href="./">全部案例</a></div></div><a href="../index.html#contact">聯絡我們</a><a class="call-btn" href="https://wa.me/85296981486" target="_blank" rel="noopener">WhatsApp　9698 1486</a></nav></div></header>
  <section class="page-hero"><div class="container"><div class="section-tag">PROJECT CASES</div><h1>工程案例</h1><p>瀏覽各類樓宇維修工程實況，了解施工過程與完成效果。</p></div></section>
  <section class="cats"><div class="container"><div id="catGrid" class="cat-grid"></div></div></section>
  <footer><div class="container"><div class="copyright">© 2026 景晉工程（香港）有限公司．版權所有。</div></div></footer>
  <script src="../js/site.js"></script>
  <script>
    function coverStyle(cat, items) {
      const cover = cat.cover || items.find((i) => i.categoryId === cat.id && i.type === "image")?.src || "";
      if (cover) return `background-image:linear-gradient(#09274255,#09274266),url('${mediaSrc(cover)}')`;
      return "background:linear-gradient(135deg,#092742,#13466d)";
    }

    loadCasesData().then((data) => {
      const cats = (data.categories || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
      const items = data.items || [];
      const menu = document.getElementById("navMenu");
      menu.innerHTML = `<a href="./">全部案例</a>` + cats.map((c) => `<a href="category.html?slug=${encodeURIComponent(c.slug)}">${c.name}</a>`).join("");

      const grid = document.getElementById("catGrid");
      if (!cats.length) {
        grid.outerHTML = `<div class="empty">尚未建立工程案例分類。請到後台新增子目錄。</div>`;
        return;
      }
      grid.innerHTML = cats.map((c) => {
        const count = items.filter((i) => i.categoryId === c.id).length;
        return `<a class="cat-card" href="category.html?slug=${encodeURIComponent(c.slug)}">
          <div class="cat-cover" style="${coverStyle(c, items)}"><span>${count} 個項目</span></div>
          <div class="cat-body"><h2>${c.name}</h2><p>${c.description || "查看相片及視頻案例"}</p></div>
        </a>`;
      }).join("");
    }).catch((err) => {
      document.getElementById("catGrid").outerHTML = `<div class="empty">${err.message}</div>`;
    });
  </script>
</body>
</html>
