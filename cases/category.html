  <style>
    :root{--navy:#092742;--orange:#ef8b27;--cream:#f7f4ed;--ink:#142534;--muted:#61717e;--line:#dbe1e3}
    *{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--ink);font-family:"Noto Sans HK",Arial,sans-serif}
    a{text-decoration:none;color:inherit}.container{width:min(1160px,calc(100% - 44px));margin:auto}
    .topbar{background:#061b2e;color:#dce9f0;font-size:13px}.topbar .container{min-height:40px;display:flex;justify-content:space-between;align-items:center;gap:20px}.quick-info{display:flex;gap:24px}.quick-info span{color:var(--orange);margin-right:5px}
    header{height:82px;background:#fff;position:sticky;top:0;z-index:10;box-shadow:0 3px 18px #09274212}.nav{height:100%;display:flex;align-items:center;justify-content:space-between}.logo{display:flex;align-items:center;gap:12px}.mark{height:47px;width:47px;background:var(--navy);color:#fff;display:grid;place-items:center;font:700 23px Oswald;clip-path:polygon(0 0,100% 0,100% 75%,50% 100%,0 75%)}.logo b{font-size:18px;letter-spacing:.08em;display:block}.logo small{font-size:10px;color:#77838c;letter-spacing:.09em}.links{display:flex;gap:27px;align-items:center;font-size:14px;font-weight:600}.links a:hover{color:var(--orange)}.call-btn{padding:12px 19px;color:#fff;background:var(--orange);font-weight:700}
    .nav-cases{position:relative}.nav-cases-trigger{display:inline-flex;align-items:center;gap:6px}.nav-cases-trigger:after{content:"▾";font-size:11px;color:var(--orange)}.nav-cases-menu{position:absolute;top:calc(100% + 14px);left:50%;transform:translateX(-50%);min-width:160px;background:#fff;box-shadow:0 12px 30px #09274222;border:1px solid var(--line);padding:8px 0;display:none;z-index:20}.nav-cases-menu a{display:block;padding:10px 18px;font-size:13px;white-space:nowrap}.nav-cases-menu a:hover{background:#f7f4ed;color:var(--orange)}.nav-cases:hover .nav-cases-menu,.nav-cases:focus-within .nav-cases-menu{display:block}
    .page-hero{background:#092742;color:#fff;padding:60px 0 48px}.section-tag{font:700 12px Oswald;letter-spacing:.18em;color:#f4a653}.page-hero h1{font-size:clamp(30px,4vw,46px);letter-spacing:.06em;margin:10px 0 12px}.page-hero p{max-width:620px;color:#dce7ed;line-height:1.8}.crumb{color:#9eb0bb;font-size:13px;margin-bottom:14px}.crumb a{color:#f4a653}
    .gallery{padding:60px 0 90px}.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.media-card{background:#fff;overflow:hidden}.media-frame{aspect-ratio:4/3;background:#0d2d46;position:relative}.media-frame img,.media-frame video{width:100%;height:100%;object-fit:cover;display:block}.media-frame iframe{width:100%;height:100%;border:0;display:block}.badge{position:absolute;top:12px;left:12px;background:var(--orange);color:#fff;font-size:11px;font-weight:700;padding:4px 9px}.media-body{padding:16px 18px}.media-body h3{margin:0 0 6px;font-size:16px}.media-body p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.empty{padding:48px;background:#fff;color:var(--muted);text-align:center}
    footer{background:#061b2e;color:#d8e1e5;padding:40px 0 22px}.copyright{border-top:1px solid #ffffff18;padding-top:18px;color:#8598a3;font-size:12px}
    @media(max-width:850px){.links{display:none}.media-grid{grid-template-columns:1fr 1fr}}
    @media(max-width:520px){.media-grid{grid-template-columns:1fr}.quick-info{display:none}}
  </style>
</head>
<body>

  <header><div class="container nav"><a class="logo" href="../index.html"><div class="mark">KC</div><div><b>景晉工程</b><small>KING CHUN ENGINEERING (H.K.) LIMITED</small></div></a><nav class="links"><a href="../index.html#about">關於我們</a><a href="../index.html#services">核心服務</a><a href="../index.html#promise">我們的承諾</a><div class="nav-cases"><a class="nav-cases-trigger" href="./">工程案例</a><div class="nav-cases-menu" id="navMenu"><a href="./">全部案例</a></div></div><a href="../index.html#contact">聯絡我們</a><a class="call-btn" href="https://wa.me/85296981486" target="_blank" rel="noopener">WhatsApp　9698 1486</a></nav></div></header>
  <section class="page-hero"><div class="container"><div class="crumb"><a href="./">工程案例</a> / <span id="crumbName">載入中</span></div><div class="section-tag">CASE GALLERY</div><h1 id="title">工程案例</h1><p id="desc"></p></div></section>
  <section class="gallery"><div class="container"><div id="mediaGrid" class="media-grid"></div></div></section>
  <footer><div class="container"><div class="copyright">© 2026 景晉工程（香港）有限公司．版權所有。</div></div></footer>
  <script src="../js/site.js"></script>
  <script>
    const slug = new URLSearchParams(location.search).get("slug") || "";

    function renderMedia(item) {
      const src = mediaSrc(item.src);
      const yt = youtubeId(src);
      let frame = "";
      if (item.type === "video") {
        if (yt) frame = `<iframe src="https://www.youtube.com/embed/${yt}" allowfullscreen loading="lazy"></iframe>`;
        else frame = `<video src="${src}" controls playsinline></video>`;
      } else {
        frame = `<img src="${src}" alt="${item.title || ""}" loading="lazy" />`;
      }
      return `<article class="media-card">
        <div class="media-frame"><span class="badge">${item.type === "video" ? "視頻" : "相片"}</span>${frame}</div>
        <div class="media-body"><h3>${item.title || "工程案例"}</h3><p>${item.caption || ""}</p></div>
      </article>`;
    }

    loadCasesData().then((data) => {
      const cats = (data.categories || []).slice().sort((a, b) => (a.order || 0) - (b.order || 0));
      document.getElementById("navMenu").innerHTML =
        `<a href="./">全部案例</a>` +
        cats.map((c) => `<a href="category.html?slug=${encodeURIComponent(c.slug)}">${c.name}</a>`).join("");

      const cat = cats.find((c) => c.slug === slug);
      if (!cat) {
        document.getElementById("title").textContent = "找不到此分類";
        document.getElementById("crumbName").textContent = "未知";
        document.getElementById("mediaGrid").outerHTML = `<div class="empty">此子目錄不存在，請回工程案例重新選擇。</div>`;
        return;
      }

      document.title = `${cat.name}｜工程案例｜景晉工程`;
      document.getElementById("title").textContent = cat.name;
      document.getElementById("crumbName").textContent = cat.name;
      document.getElementById("desc").textContent = cat.description || "瀏覽此分類的相片及視頻。";

      const items = (data.items || [])
        .filter((i) => i.categoryId === cat.id)
        .sort((a, b) => (a.order || 0) - (b.order || 0));

      const grid = document.getElementById("mediaGrid");
      if (!items.length) {
        grid.outerHTML = `<div class="empty">此分類尚未加入相片或視頻。請到後台新增媒體。</div>`;
        return;
      }
      grid.innerHTML = items.map(renderMedia).join("");
    }).catch((err) => {
      document.getElementById("mediaGrid").outerHTML = `<div class="empty">${err.message}</div>`;
    });
  </script>
</body>
</html>
